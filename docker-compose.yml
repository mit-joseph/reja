version: "1.1"

services:
  node:
    container_name: reja
    restart: always
    image: mit32/reja-app
    ports:
      - 4001:4000
    volumes:
      - ./:/usr/src/app
    working_dir: /usr/src/app

    networks:
      - reja_network

    command: bash -c "npm install && npm run dev"

networks:
  reja_network:
    driver: bridge